services:
  django:
    build: ./PythonDocker
    image: python:3.10
    container_name: contenedor_django
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./PythonDocker:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./MySQLDocker/
    container_name: mysql_db
    ports:
      - "3306:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-pmy-secret-pw", "-e", "SELECT 1"]
      timeout: 20s
      retries: 10